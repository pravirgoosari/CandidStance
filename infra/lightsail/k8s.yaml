apiVersion: v1
kind: Namespace
metadata:
  name: candidstance
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: candidstance
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: candidstance
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
          envFrom:
            - secretRef: {name: postgres-secrets}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "candidstance", "-d", "candidstance"]
            initialDelaySeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: schema
          configMap: {name: postgres-schema}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidstance-app
  namespace: candidstance
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: candidstance-app}
  template:
    metadata:
      labels: {app: candidstance-app}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: candidstance-app
          image: CANDIDSTANCE_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: candidstance-secrets}
          env:
            - {name: NODE_OPTIONS, value: --max-old-space-size=256}
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 384Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet: {path: /api/health, port: 3000}
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: candidstance-app
  namespace: candidstance
spec:
  type: ClusterIP
  selector: {app: candidstance-app}
  ports:
    - {port: 80, targetPort: 3000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: candidstance
  namespace: candidstance
spec:
  ingressClassName: traefik
  rules:
    - host: candidstance.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: candidstance-app
                port: {number: 80}
    - host: www.candidstance.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: candidstance-app
                port: {number: 80}
